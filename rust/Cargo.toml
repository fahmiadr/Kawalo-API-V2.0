[package]
name = "kawalo-api"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws", "macros"] }
base64 = "0.23.1"
bytes = "1.12.1"
chrono = "0.4.45"
dotenvy = "0.15.7"
form_urlencoded = "1.2.2"
futures-util = "0.3.34"
hex = "0.4.3"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
log = "0.4.35"
notify = "8.2.2"
rand = "0.10.3"
rand_core06 = { version = "0.6", package = "rand_core", features = ["getrandom"] }
redis = { version = "1.8.1", features = ["tokio-comp", "connection-manager"] }
regex = "1.13.1"
rsa = "0.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
serde_path_to_error = "0.1.20"
serde_urlencoded = "0.7.1"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "mysql", "chrono", "json", "macros"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["catch-panic"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.29.2", features = ["v4", "v7"] }

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"

[lints.clippy]
all = { level = "warn", priority = -1 }

# RSA-4096 key generation is unusably slow unoptimised; dependencies are cheap to build once.
[profile.dev.package."*"]
opt-level = 3

[[bin]]
name = "kawalo-api"
path = "src/main.rs"

[[bin]]
name = "rotate_key"
path = "src/bin/rotate_key.rs"
