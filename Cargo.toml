[package]
name = "kawalo-api"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
aws-lc-rs = "1.19.0"
axum = { version = "0.8.9", features = ["ws", "macros", "multipart"] }
base64 = "0.23.1"
bytes = "1.12.1"
chrono = "0.4.45"
dashmap = "6.2.1"
dotenvy = "0.15.7"
form_urlencoded = "1.2.2"
futures-util = "0.3.34"
hex = "0.4.3"
# JPEG only: face photos are decoded for inference and re-encoded small before encrypted storage.
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
jsonwebtoken = { version = "11.1.0", features = ["aws_lc_rs"] }
log = "0.4.35"
mimalloc = "0.1.52"
notify = "8.2.2"
ogg = { version = "0.9.2", default-features = false }
# `load-dynamic`: ONNX Runtime is dlopen'ed from FACE_ORT_LIBRARY at startup, so nothing is
# downloaded or linked at build time and cross-compiling with cargo-zigbuild is unaffected.
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["load-dynamic"] }
pem = "3"
rand = "0.10.3"
redis = { version = "1.8.1", features = ["tokio-comp", "connection-manager"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
serde_path_to_error = "0.1.20"
serde_urlencoded = "0.7.1"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "mysql", "chrono", "json", "macros"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["io"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["catch-panic"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
unsafe-libopus = "0.2.0"
uuid = { version = "1.29.2", features = ["v4", "v7"] }

[dev-dependencies]
http-body-util = "0.1.5"
tokio-tungstenite = "0.30.0"

[lints.clippy]
all = { level = "warn", priority = -1 }

# RSA-4096 key generation is unusably slow unoptimised; dependencies are cheap to build once.
[profile.dev.package."*"]
opt-level = 3

# Panics stay unwinding: the panic-catching layer turns a handler panic into a 500 instead of
# aborting the process.
[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"

[[bin]]
name = "kawalo-api"
path = "src/main.rs"

[[bin]]
name = "rotate_key"
path = "src/bin/rotate_key.rs"

[[bin]]
name = "ptt_transcriber"
path = "src/bin/ptt_transcriber.rs"
